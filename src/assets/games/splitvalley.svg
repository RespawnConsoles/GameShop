<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="200" height="200" fill="#0a0a0a"/>

  <!-- Purple border corners -->
  <rect x="0" y="0" width="200" height="5" fill="#7c3aed"/>
  <rect x="0" y="195" width="200" height="5" fill="#7c3aed"/>
  <rect x="0" y="0" width="5" height="200" fill="#7c3aed"/>
  <rect x="195" y="0" width="5" height="200" fill="#7c3aed"/>

  <!-- Ground / valley base -->
  <rect x="0" y="160" width="200" height="40" fill="#1a0a2e"/>
  <rect x="0" y="155" width="200" height="5" fill="#7c3aed"/>

  <!-- Left castle tower -->
  <rect x="10" y="90" width="56" height="70" fill="#5b21b6"/>
  <rect x="10" y="85" width="56" height="5" fill="#7c3aed"/>
  <!-- Tower crenellations (left) -->
  <rect x="10" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="26" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="42" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="54" y="72" width="12" height="18" fill="#5b21b6"/>
  <!-- Tower window (left) -->
  <rect x="26" y="108" width="20" height="24" fill="#0a0a0a"/>
  <rect x="26" y="108" width="20" height="3" fill="#7c3aed"/>
  <!-- Flag (left) -->
  <rect x="28" y="50" width="4" height="24" fill="#fcfcfc"/>
  <rect x="32" y="50" width="14" height="10" fill="#d82800"/>
  <rect x="32" y="60" width="14" height="6" fill="#f8b800"/>

  <!-- Right castle tower -->
  <rect x="134" y="90" width="56" height="70" fill="#5b21b6"/>
  <rect x="134" y="85" width="56" height="5" fill="#7c3aed"/>
  <!-- Tower crenellations (right) -->
  <rect x="134" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="150" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="166" y="72" width="12" height="18" fill="#5b21b6"/>
  <rect x="178" y="72" width="12" height="18" fill="#5b21b6"/>
  <!-- Tower window (right) -->
  <rect x="154" y="108" width="20" height="24" fill="#0a0a0a"/>
  <rect x="154" y="108" width="20" height="3" fill="#7c3aed"/>
  <!-- Flag (right) -->
  <rect x="168" y="50" width="4" height="24" fill="#fcfcfc"/>
  <rect x="154" y="50" width="14" height="10" fill="#00b800"/>
  <rect x="154" y="60" width="14" height="6" fill="#f8b800"/>

  <!-- Valley gap (dark) -->
  <rect x="66" y="100" width="68" height="60" fill="#0a0a0a"/>
  <rect x="66" y="100" width="68" height="3" fill="#3b0764"/>

  <!-- Crossed swords in valley center -->
  <!-- Sword 1 (top-left to bottom-right) -->
  <rect x="84" y="114" width="7" height="7" fill="#c084fc"/>
  <rect x="90" y="120" width="7" height="7" fill="#c084fc"/>
  <rect x="96" y="126" width="7" height="7" fill="#c084fc"/>
  <rect x="102" y="132" width="7" height="7" fill="#c084fc"/>
  <!-- Hilt 1 -->
  <rect x="80" y="118" width="14" height="4" fill="#f8b800"/>
  <!-- Sword 2 (top-right to bottom-left) -->
  <rect x="110" y="114" width="7" height="7" fill="#c084fc"/>
  <rect x="104" y="120" width="7" height="7" fill="#c084fc"/>
  <rect x="98" y="126" width="7" height="7" fill="#c084fc"/>
  <rect x="92" y="132" width="7" height="7" fill="#c084fc"/>
  <!-- Hilt 2 -->
  <rect x="107" y="118" width="14" height="4" fill="#f8b800"/>

  <!-- Stars in sky -->
  <rect x="80" y="20" width="4" height="4" fill="#f8b800"/>
  <rect x="100" y="30" width="4" height="4" fill="#c084fc"/>
  <rect x="120" y="18" width="4" height="4" fill="#f8b800"/>
  <rect x="110" y="40" width="3" height="3" fill="#c084fc"/>
  <rect x="90" y="44" width="3" height="3" fill="#f8b800"/>
</svg>
